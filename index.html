<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktik Event pada Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      overflow: hidden; /* supaya tidak muncul scrollbar saat tombol bergerak */
    }

    h1 { margin-bottom: 8px; }
    p  { margin-top: 0; color: #555; }

    #tombol {
      position: absolute;           /* agar posisinya bisa diubah lewat JS */
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: left 0.2s ease, top 0.2s ease; /* gerakan halus */
    }

    #tombol:hover { background: #1d4ed8; }

  </style>
</head>
<body>

  <h1>Coba Klik Tombol Ini!</h1>
  <p>Kalau bisa, tombolnya akan kamu tangkap 😄</p>

  <button id="tombol">Klik Aku</button>

  <script>
    const tombol = document.getElementById("tombol");

    // Fungsi memindahkan tombol ke posisi acak di dalam layar
    function pindahkanTombol() {
      const maxX = window.innerWidth  - tombol.offsetWidth;
      const maxY = window.innerHeight - tombol.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      tombol.style.left = x + "px";
      tombol.style.top  = y + "px";
    }

    // Posisi awal: tengah layar
    tombol.style.left = (window.innerWidth  - 120) / 2 + "px";
    tombol.style.top  = (window.innerHeight / 2 + 40) + "px";

    // EVENT: saat kursor menyentuh tombol, tombol langsung kabur
    tombol.addEventListener("mouseover", pindahkanTombol);

    // EVENT: untuk layar sentuh (HP/tablet)
    tombol.addEventListener("touchstart", function (e) {
      e.preventDefault();
      pindahkanTombol();
    });

    // Cadangan: jika berhasil ter-klik, tetap kabur
    tombol.addEventListener("click", pindahkanTombol);
  </script>
</body>
</html>
